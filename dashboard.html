<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthZ Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral:       #FF3B5E;
    --coral-light: #FFF0F3;
    --coral-mid:   #FFD6DE;
    --green:       #00B386;
    --green-light: #E6F9F4;
    --amber:       #F59E0B;
    --amber-light: #FFFBEB;
    --gray-50:     #F9FAFB;
    --gray-100:    #F3F4F6;
    --gray-200:    #E5E7EB;
    --gray-400:    #9CA3AF;
    --gray-500:    #6B7280;
    --gray-700:    #374151;
    --gray-900:    #111827;
    --white:       #FFFFFF;
    --sidebar-w:   260px;
    --radius-sm:   8px;
    --radius-md:   12px;
    --radius-lg:   16px;
    --shadow-sm:   0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────────────────── */
  .header {
    height: 56px;
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }
  .header-logo {
    width: 32px; height: 32px;
    background: var(--coral);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .header-title { font-weight: 700; font-size: 15px; color: var(--gray-900); }
  .header-sub   { font-size: 13px; color: var(--gray-400); margin-left: 2px; }
  .header-spacer { flex: 1; }
  .header-badge {
    background: var(--coral-light);
    color: var(--coral);
    font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 20px;
  }

  /* ── Layout ──────────────────────────────────────────── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--white);
    border-right: 1px solid var(--gray-200);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  .sidebar-section {
    padding: 16px 16px 8px;
    font-size: 11px; font-weight: 600;
    color: var(--gray-400);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .run-item {
    padding: 10px 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background .15s;
    margin-bottom: 2px;
  }
  .run-item:hover  { background: var(--gray-100); }
  .run-item.active { background: var(--coral-light); }
  .run-item-name {
    font-size: 13px; font-weight: 600;
    color: var(--gray-900);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .run-item.active .run-item-name { color: var(--coral); }
  .run-item-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 4px;
  }
  .domain-chip {
    font-size: 10px; font-weight: 600;
    background: var(--gray-100); color: var(--gray-500);
    padding: 2px 7px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .run-item.active .domain-chip { background: var(--coral-mid); color: var(--coral); }
  .progress-text { font-size: 11px; color: var(--gray-400); }

  .inbox-section { border-top: 1px solid var(--gray-200); padding: 12px 8px; }
  .inbox-item {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px; color: var(--gray-500);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: default;
  }
  .inbox-item:hover { background: var(--gray-100); }
  .inbox-dot {
    display: inline-block; width: 7px; height: 7px;
    background: var(--amber); border-radius: 50%; margin-right: 6px;
  }

  /* ── Main ────────────────────────────────────────────── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
  }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%;
    color: var(--gray-400);
    gap: 12px;
  }
  .empty-icon { font-size: 40px; }
  .empty-text { font-size: 15px; font-weight: 500; }
  .empty-sub  { font-size: 13px; }

  /* ── Run header ──────────────────────────────────────── */
  .run-header { margin-bottom: 24px; }
  .run-title {
    font-size: 22px; font-weight: 700;
    color: var(--gray-900); line-height: 1.3;
    margin-bottom: 8px;
  }
  .run-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500;
    padding: 4px 10px; border-radius: 20px;
  }
  .pill-domain   { background: var(--coral-light); color: var(--coral); }
  .pill-status   { background: var(--amber-light); color: var(--amber); }
  .pill-status.merged { background: var(--green-light); color: var(--green); }
  .pill-date     { background: var(--gray-100); color: var(--gray-500); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── Cards ───────────────────────────────────────────── */
  .card {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--gray-200);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    font-size: 12px; font-weight: 600;
    color: var(--gray-400);
    letter-spacing: .06em; text-transform: uppercase;
    border-bottom: 1px solid var(--gray-100);
    display: flex; align-items: center; gap: 8px;
  }
  .card-header-count {
    background: var(--gray-100); color: var(--gray-500);
    font-size: 11px; font-weight: 700;
    padding: 1px 7px; border-radius: 20px;
  }

  /* ── Summary card ────────────────────────────────────── */
  .summary-text {
    padding: 16px 18px;
    font-size: 13px; line-height: 1.7;
    color: var(--gray-700);
  }

  /* ── Pipeline steps ──────────────────────────────────── */
  .step-row {
    display: flex; align-items: flex-start;
    padding: 16px 18px;
    border-bottom: 1px solid var(--gray-100);
    gap: 14px;
    transition: background .12s;
  }
  .step-row:last-child { border-bottom: none; }
  .step-row:hover { background: var(--gray-50); }

  .step-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 1px;
  }
  .step-icon.not-started { background: var(--gray-100); color: var(--gray-400); }
  .step-icon.in-progress { background: var(--amber-light); color: var(--amber); }
  .step-icon.signed-off  { background: var(--green-light); color: var(--green); }

  .step-body { flex: 1; min-width: 0; }
  .step-top  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .step-num  { font-size: 11px; font-weight: 700; color: var(--gray-400); }
  .step-name { font-size: 14px; font-weight: 600; color: var(--gray-900); }
  .step-file { font-size: 12px; color: var(--gray-400); font-family: 'SF Mono', monospace; }

  .status-badge {
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 20px;
  }
  .status-badge.not-started { background: var(--gray-100); color: var(--gray-400); }
  .status-badge.in-progress { background: var(--amber-light); color: var(--amber); }
  .status-badge.signed-off  { background: var(--green-light); color: var(--green); }

  .step-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

  .btn-copy {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    color: var(--coral);
    background: var(--coral-light);
    border: none; border-radius: var(--radius-sm);
    padding: 6px 12px; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-copy:hover  { background: var(--coral-mid); }
  .btn-copy:active { transform: scale(.97); }
  .btn-copy.copied { background: var(--green-light); color: var(--green); }

  .btn-view {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500;
    color: var(--gray-500);
    background: var(--gray-100);
    border: none; border-radius: var(--radius-sm);
    padding: 6px 12px; cursor: pointer;
    transition: background .15s;
  }
  .btn-view:hover { background: var(--gray-200); }

  .step-command {
    margin-top: 8px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--gray-500);
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    display: none;
  }
  .step-command.show { display: block; }

  /* ── File viewer ─────────────────────────────────────── */
  .file-viewer {
    display: none;
    background: var(--gray-50);
    border-top: 1px solid var(--gray-200);
    padding: 16px 18px;
  }
  .file-viewer.show { display: block; }
  .file-viewer pre {
    font-size: 12px; line-height: 1.7;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--gray-700);
    white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow-y: auto;
  }

  /* ── Issues ──────────────────────────────────────────── */
  .issue-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--gray-100);
  }
  .issue-row:last-child { border-bottom: none; }
  .issue-icon {
    width: 24px; height: 24px;
    background: var(--amber-light); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0; margin-top: 1px;
  }
  .issue-title  { font-size: 13px; font-weight: 600; color: var(--gray-900); }
  .issue-detail { font-size: 12px; color: var(--gray-500); margin-top: 2px; line-height: 1.5; }

  /* ── Decisions ───────────────────────────────────────── */
  .decision-row {
    display: flex; gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--gray-100);
  }
  .decision-row:last-child { border-bottom: none; }
  .decision-date { font-size: 12px; font-weight: 600; color: var(--gray-400); white-space: nowrap; min-width: 90px; }
  .decision-note { font-size: 13px; color: var(--gray-700); line-height: 1.5; }

  /* ── Scrollbar ───────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 10px; }

  /* ── Loading ─────────────────────────────────────────── */
  .loading { padding: 40px; text-align: center; color: var(--gray-400); font-size: 13px; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-logo">A</div>
  <span class="header-title">AuthZ Pipeline</span>
  <span class="header-sub">/ Lara Banks</span>
  <div class="header-spacer"></div>
  <span class="header-badge" id="run-count">Loading…</span>
</header>

<!-- Layout -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">Runs</div>
    <div class="sidebar-list" id="run-list">
      <div class="loading">Loading runs…</div>
    </div>
    <div class="inbox-section" id="inbox-section"></div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <div class="empty-state">
      <div class="empty-icon">⚡</div>
      <div class="empty-text">Select a run</div>
      <div class="empty-sub">Choose a run from the sidebar to see its pipeline</div>
    </div>
  </main>

</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let activeRun = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────
const statusLabel = { 'not-started': 'Not started', 'in-progress': 'In progress', 'signed-off': 'Signed off' };
const statusIcon  = { 'not-started': '○', 'in-progress': '◐', 'signed-off': '✓' };

function statusClass(s) {
  if (s === 'signed-off')  return 'signed-off';
  if (s === 'in-progress') return 'in-progress';
  return 'not-started';
}

async function copyText(text, btn) {
  await navigator.clipboard.writeText(text);
  btn.classList.add('copied');
  btn.textContent = '✓ Copied';
  setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '⌘ Copy command'; }, 2000);
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
async function loadSidebar() {
  const [runs, inbox] = await Promise.all([
    fetch('/api/runs').then(r => r.json()),
    fetch('/api/inbox').then(r => r.json()),
  ]);

  document.getElementById('run-count').textContent =
    runs.length === 1 ? '1 run' : `${runs.length} runs`;

  const list = document.getElementById('run-list');
  if (runs.length === 0) {
    list.innerHTML = '<div class="loading">No runs yet</div>';
  } else {
    list.innerHTML = runs.map(r => `
      <div class="run-item" data-run="${r.name}" onclick="selectRun('${r.name}')">
        <div class="run-item-name">${r.title}</div>
        <div class="run-item-meta">
          <span class="domain-chip">${r.domain}</span>
          <span class="progress-text">${r.steps_done}/${r.steps_total} done</span>
        </div>
      </div>`).join('');
  }

  const inboxEl = document.getElementById('inbox-section');
  if (inbox.length > 0) {
    inboxEl.innerHTML = `
      <div class="sidebar-section" style="padding-top:0">Inbox</div>
      ${inbox.map(f => `
        <div class="inbox-item" title="${f.name}">
          <span class="inbox-dot"></span>${f.name}
        </div>`).join('')}`;
  }
}

// ─── Run detail ───────────────────────────────────────────────────────────────
async function selectRun(name) {
  activeRun = name;
  document.querySelectorAll('.run-item').forEach(el => {
    el.classList.toggle('active', el.dataset.run === name);
  });

  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Loading…</div>';

  const run = await fetch(`/api/run/${name}`).then(r => r.json());
  renderRun(run, main);
}

function renderRun(run, container) {
  const fm = run.frontmatter;
  const statusCls = fm.status === 'merged' ? 'merged' : '';

  container.innerHTML = `
    <!-- Run header -->
    <div class="run-header">
      <div class="run-title">${fm.title || run.name}</div>
      <div class="run-pills">
        <span class="pill pill-domain"><span class="pill-dot"></span>${fm.domain}</span>
        <span class="pill pill-status ${statusCls}"><span class="pill-dot"></span>${fm.status}</span>
        ${fm.opened ? `<span class="pill pill-date">Opened ${fm.opened}</span>` : ''}
        ${fm.target_close ? `<span class="pill pill-date">Target ${fm.target_close}</span>` : ''}
      </div>
    </div>

    <!-- Summary -->
    ${run.summary ? `
    <div class="card">
      <div class="card-header">What this run is</div>
      <div class="summary-text">${run.summary}</div>
    </div>` : ''}

    <!-- Pipeline -->
    <div class="card">
      <div class="card-header">Pipeline</div>
      ${run.steps.map(step => renderStep(step, run.name)).join('')}
    </div>

    <!-- Open issues -->
    ${run.issues.length > 0 ? `
    <div class="card">
      <div class="card-header">
        Open issues
        <span class="card-header-count">${run.issues.length}</span>
      </div>
      ${run.issues.map(i => `
        <div class="issue-row">
          <div class="issue-icon">⚠</div>
          <div>
            <div class="issue-title">${i.title}</div>
            <div class="issue-detail">${i.detail}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}

    <!-- Decisions log -->
    ${run.decisions.length > 0 ? `
    <div class="card">
      <div class="card-header">Decisions log</div>
      ${run.decisions.map(d => `
        <div class="decision-row">
          <div class="decision-date">${d.date}</div>
          <div class="decision-note">${d.note}</div>
        </div>`).join('')}
    </div>` : ''}
  `;
}

function renderStep(step, runName) {
  const sc  = statusClass(step.status);
  const lbl = statusLabel[step.status] || step.status;
  const icon = statusIcon[step.status] || '○';

  return `
    <div class="step-row" id="step-${step.step}">
      <div class="step-icon ${sc}">${icon}</div>
      <div class="step-body">
        <div class="step-top">
          <span class="step-num">Step ${step.step}</span>
          <span class="step-name">${step.specialist}</span>
          <span class="step-file">${step.output}</span>
          <span class="status-badge ${sc}">${lbl}</span>
        </div>
        <div class="step-actions">
          <button class="btn-copy" onclick="copyCmd(this, '${step.command}')">⌘ Copy command</button>
          ${step.has_output ? `<button class="btn-view" onclick="toggleFile(this, '${runName}', '${step.output}', ${step.step})">↓ View output</button>` : ''}
        </div>
        <div class="step-command" id="cmd-${step.step}">${step.command}</div>
      </div>
    </div>
    <div class="file-viewer" id="file-${step.step}">
      <pre id="file-content-${step.step}">Loading…</pre>
    </div>`;
}

function copyCmd(btn, cmd) {
  // Show command text inline then copy
  const stepNum = btn.closest('.step-body').querySelector('[id^=cmd-]').id.replace('cmd-','');
  const cmdEl   = document.getElementById(`cmd-${stepNum}`);
  cmdEl.classList.toggle('show');
  copyText(cmd, btn);
}

async function toggleFile(btn, runName, filename, stepNum) {
  const viewer  = document.getElementById(`file-${stepNum}`);
  const content = document.getElementById(`file-content-${stepNum}`);

  if (viewer.classList.contains('show')) {
    viewer.classList.remove('show');
    btn.textContent = '↓ View output';
    return;
  }

  viewer.classList.add('show');
  btn.textContent = '↑ Hide output';

  const data = await fetch(`/api/file/${runName}/${filename}`).then(r => r.json());
  content.textContent = data.exists ? data.content : '(file not found)';
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadSidebar();
</script>
</body>
</html>
